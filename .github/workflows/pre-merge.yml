name: pre_merge

on:
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest_fast:
    strategy:
      matrix:
        # os: [ ubuntu-24.04 ]
        os: [ubuntu-24.04, macos-15]
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-py3.12

      - name: Install System dependencies
        run: |
          # if macos
          if [ "$(uname)" = "Darwin" ]; then
            # install brew
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo '#'
            echo '#'
            echo '#'
            echo '#'
            echo '#'
            brew --prefix
            uv run python -c "import platform,sys; print(platform.machine()); print(sys.executable)"
            echo '#'
            echo '#'
            echo '#'
            echo '#'
            echo '#'
            brew install gnu-sed portaudio git-lfs libjpeg-turbo
            export PATH="/opt/homebrew/opt/gnu-sed/libexec/gnubin:$PATH"
            # export ARCHFLAGS="-arch $(uname -m)"
          # if ubuntu
          else
            sudo apt-get update
            sudo apt-get install -y \
              curl \
              g++ \
              portaudio19-dev \
              git-lfs \
              libturbojpeg \
              python3-dev \
              pre-commit
          fi

      - name: Install and run tests
        run: |
          bin/ci-fast