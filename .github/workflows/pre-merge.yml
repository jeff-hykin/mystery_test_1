name: pre_merge

on:
  # pull_request:
  #   branches:
  #     - master
  #     - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest_fast:
    strategy:
      matrix:
        # os: [ ubuntu-24.04 ]
        os: [ macos-15 ]
        # os: [ubuntu-24.04, macos-15]
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          # enable-cache: true
          # cache-suffix: ${{ runner.os }}-${{ runner.arch }}-py3.12

      - name: Install System dependencies
        run: |
          # if macos
          if [ "$(uname)" = "Darwin" ]; then
            # macos cant perform the -march=native optimization on the universal binary (arm and x86 combined)
            # we have to switch to the arm-only binary to make it work
            uv run --no-sync python -c "import platform,sys; print(platform.machine()); print(sys.executable)"
            file "$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
            python3 -c "import sysconfig; print(sysconfig.get_config_var('CFLAGS'))"
            
            
            # stupid hack cause python+cmake sucks (and also because of our -match=native requirement)
            # Create a tiny compiler wrapper that strips:  -arch x86_64
            # (handles both forms: "-arch x86_64" and "-arch=x86_64")
            # Writes the script using echo (as requested).
            mkdir -p .ci/bin

            echo '#!/usr/bin/env bash
            set -e

            # Choose the real compiler based on how we were invoked
            base="$(basename "$0")"
            if [[ "$base" == *"++"* ]]; then
              real="$(xcrun --find clang++)"
            else
              real="$(xcrun --find clang)"
            fi

            # Filter args: remove "-arch x86_64" (two-arg form) and "-arch=x86_64" (one-arg form)
            out=()
            skip_next=0
            for a in "$@"; do
              if (( skip_next )); then
                skip_next=0
                continue
              fi

              if [[ "$a" == "-arch" ]]; then
                skip_next=1
                continue
              fi

              if [[ "$a" == "x86_64" ]]; then
                # only gets hit if someone passed a bare x86_64 without -arch; ignore it
                continue
              fi

              if [[ "$a" == "-arch=x86_64" ]]; then
                continue
              fi

              out+=("$a")
            done

            exec "$real" "${out[@]}"
            ' > .ci/bin/clang-strip-x86

            chmod +x .ci/bin/clang-strip-x86

            # Provide both CC and CXX entrypoints (some builds call clang++, some call clang)
            ln -sf clang-strip-x86 .ci/bin/clang
            ln -sf clang-strip-x86 .ci/bin/clang++
            ln -sf clang-strip-x86 .ci/bin/cc
            ln -sf clang-strip-x86 .ci/bin/c++

            # Use these in the same step you run uv/pip
            export PATH="$PWD/.ci/bin:$PATH"
            export CC="$PWD/.ci/bin/clang"
            export CXX="$PWD/.ci/bin/clang++"
            
            
            # because we add "-march=native" in setup.py and there's a compiler arg issue with that on macos arm
            export ARCHFLAGS="-arch $(uname -m)"
            export CFLAGS="-O3 -march=armv8-a"
            export CXXFLAGS="-O3 -march=armv8-a"
            export CMAKE_OSX_ARCHITECTURES=$(uname -m)
            # export CXXFLAGS="-Xclang -target-cpu -Xclang $target"
            # export CFLAGS="-Xclang -target-cpu -Xclang $target"
            # install brew
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            brew install gnu-sed portaudio git-lfs libjpeg-turbo pre-commit
            echo "================ HOST INFO ================"
            uname -a
            echo "uname -m: $(uname -m)"
            echo "Rosetta translated (1=yes, 0=no):"
            sysctl -n sysctl.proc_translated 2>/dev/null || echo "not supported"

            echo
            echo "================ PYTHON DISCOVERY ================"
            echo "which python:"
            which python 2>/dev/null || echo "python not found"
            echo "which python3:"
            which python3 2>/dev/null || echo "python3 not found"
            echo "all python3 in PATH:"
            which -a python3 2>/dev/null || true

            echo
            echo "================ PYTHON RUNTIME VIEW ================"
            python3 -c "import platform, sys, struct, sysconfig; \
            print('platform.machine() =', platform.machine()); \
            print('platform.platform() =', platform.platform()); \
            print('sys.executable =', sys.executable); \
            print('sys.version =', sys.version.replace('\n',' ')); \
            print('pointer_bits =', struct.calcsize('P')*8); \
            print('sysconfig platform =', sysconfig.get_platform()); \
            print('CC =', sysconfig.get_config_var('CC')); \
            print('CFLAGS =', sysconfig.get_config_var('CFLAGS')); \
            print('LDSHARED =', sysconfig.get_config_var('LDSHARED'))"

            PYEXE=$(python3 -c "import sys; print(sys.executable)")
            echo
            echo "================ PYTHON MACH-O INFO ================"
            echo "Executable: $PYEXE"
            ls -la "$PYEXE"
            file "$PYEXE"
            echo "lipo -archs:"
            lipo -archs "$PYEXE" 2>/dev/null || echo "not universal or lipo failed"
            echo "Mach-O header:"
            otool -hv "$PYEXE" 2>/dev/null || true
            echo "Linked libraries:"
            otool -L "$PYEXE" 2>/dev/null || true

            echo
            echo "================ ENV FLAGS (possible arch pollution) ================"
            env | grep -E '^(ARCHFLAGS|CFLAGS|CXXFLAGS|LDFLAGS|SDKROOT|MACOSX_DEPLOYMENT_TARGET|CMAKE_OSX_ARCHITECTURES|_PYTHON_HOST_PLATFORM|UV_.*)=' || echo "No suspicious env flags found"

            echo
            echo "================ CLANG INFO ================"
            echo "clang location:"
            xcrun --find clang
            echo "clang version:"
            xcrun clang --version

            echo
            echo "clang default target:"
            xcrun clang -v -E - </dev/null 2>&1

            echo
            echo "clang registered targets:"
            xcrun clang -print-targets 2>/dev/null || echo "print-targets not supported"

            echo
            echo "================ CLANG TEST COMPILE ================"
            TMPDIR=$(mktemp -d)
            echo "int main(){return 0;}" > "$TMPDIR/t.c"

            echo
            echo "Default compile:"
            xcrun clang -c "$TMPDIR/t.c" -o "$TMPDIR/default.o"
            file "$TMPDIR/default.o"

            echo
            echo "Try ARM64 compile:"
            xcrun clang -target arm64-apple-macos13 -c "$TMPDIR/t.c" -o "$TMPDIR/arm64.o" 2>&1
            file "$TMPDIR/arm64.o" 2>/dev/null || echo "arm64 compile failed"

            echo
            echo "Try x86_64 compile:"
            xcrun clang -target x86_64-apple-macos13 -c "$TMPDIR/t.c" -o "$TMPDIR/x86_64.o" 2>&1
            file "$TMPDIR/x86_64.o" 2>/dev/null || echo "x86_64 compile failed"

            echo
            echo "================ SDK INFO ================"
            echo "SDK path:"
            xcrun --sdk macosx --show-sdk-path
            echo "SDK version:"
            xcrun --sdk macosx --show-sdk-version 2>/dev/null || true
            echo "Xcode path:"
            xcode-select -p 2>/dev/null || true

            rm -rf "$TMPDIR"

            echo
            echo "================ END DIAGNOSTIC ================"
            export PATH="/opt/homebrew/opt/gnu-sed/libexec/gnubin:$PATH"
          # if ubuntu
          else
            sudo apt-get update
            sudo apt-get install -y \
              curl \
              g++ \
              portaudio19-dev \
              git-lfs \
              libturbojpeg \
              python3-dev \
              pre-commit
          fi

      - name: Install and run tests
        run: |
          bin/ci-fast