name: pre_merge

on:
  #pull_request:
  #  branches:
  #    - master
  #    - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest_fast:
    strategy:
      matrix:
        # os: [ ubuntu-24.04 ]
        os: [ macos-15 ]
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-py3.12

      - name: Install System dependencies
        run: |
          # if macos
          if [ "$(uname)" = "Darwin" ]; then
            # install brew
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo '#'
            echo '#'
            echo '#'
            echo '#'
            echo '#'
              echo "================ HOST INFO ================"
              uname -a
              echo "uname -m: $(uname -m)"
              echo "Rosetta translated (1=yes, 0=no):"
              sysctl -n sysctl.proc_translated 2>/dev/null || echo "not supported"

              echo
              echo "================ PYTHON DISCOVERY ================"
              echo "which python:"
              which python 2>/dev/null || echo "python not found"
              echo "which python3:"
              which python3 2>/dev/null || echo "python3 not found"
              echo "all python3 in PATH:"
              which -a python3 2>/dev/null || true

              echo
              echo "================ PYTHON RUNTIME VIEW ================"
              uv run python -c "import platform, sys, struct, sysconfig; \
              print('platform.machine() =', platform.machine()); \
              print('platform.platform() =', platform.platform()); \
              print('sys.executable =', sys.executable); \
              print('sys.version =', sys.version.replace('\n',' ')); \
              print('pointer_bits =', struct.calcsize('P')*8); \
              print('sysconfig platform =', sysconfig.get_platform()); \
              print('CC =', sysconfig.get_config_var('CC')); \
              print('CFLAGS =', sysconfig.get_config_var('CFLAGS')); \
              print('LDSHARED =', sysconfig.get_config_var('LDSHARED'))"

              PYEXE=$(uv run python -c "import sys; print(sys.executable)")
              echo
              echo "================ PYTHON MACH-O INFO ================"
              echo "Executable: $PYEXE"
            echo '#'
            echo '#'
            echo '#'
            echo '#'
            echo '#'
            brew install gnu-sed portaudio git-lfs libjpeg-turbo
            export PATH="/opt/homebrew/opt/gnu-sed/libexec/gnubin:$PATH"
            export ARCHFLAGS="arm64"
          # if ubuntu
          else
            sudo apt-get update
            sudo apt-get install -y \
              curl \
              g++ \
              portaudio19-dev \
              git-lfs \
              libturbojpeg \
              python3-dev \
              pre-commit
          fi

      - name: Install and run tests
        run: |
          bin/ci-fast
