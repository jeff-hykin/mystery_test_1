name: pre_merge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest_fast:
    strategy:
      matrix:
        os: [ macos-15 ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-py3.12

      - name: Install System dependencies
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            # Set the environment variables to pass the correct flags to clang/clang++
            export CXXFLAGS="-Xclang -target-cpu -Xclang arm64"
            export CFLAGS="-Xclang -target-cpu -Xclang arm64"
            echo "================ HOST INFO ================"
            uname -a
            echo "uname -m: $(uname -m)"
            echo "Runner arch: ${{ runner.arch }}"
            echo "Rosetta translated (1=yes, 0=no):"
            sysctl -n sysctl.proc_translated 2>/dev/null || echo "not supported"
            echo

            echo "================ XCODE / SDK ================"
            xcode-select -p || true
            xcodebuild -version || true
            xcrun --show-sdk-path || true
            xcrun --show-sdk-version || true
            echo

            echo "================ CLANG DISCOVERY ================"
            which clang || true
            which clang++ || true
            which -a clang || true
            which -a clang++ || true
            echo

            echo "================ CLANG VERSION ================"
            clang --version || true
            clang++ --version || true
            echo

            echo "================ CLANG VERBOSE (-v) ================"
            clang -v || true
            echo

            echo "================ CLANG TARGET INFO ================"
            clang -print-target-triple || true
            clang -print-effective-triple || true
            clang -dumpmachine || true
            echo

            echo "================ CLANG SUPPORTED TARGETS ================"
            clang --print-supported-cpus 2>/dev/null || true
            echo

            echo "================ CLANG DRIVER TRACE ================"
            echo 'int main(){return 0;}' > test.cpp
            clang++ -### test.cpp 2>&1 || true
            echo

            echo "================ ENVIRONMENT FLAGS ================"
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "CFLAGS=$CFLAGS"
            echo "CXXFLAGS=$CXXFLAGS"
            echo "ARCHFLAGS=$ARCHFLAGS"
            echo

            echo "================ PYTHON DISCOVERY ================"
            which python || true
            which python3 || true
            which -a python3 || true
            echo

            echo "================ PYTHON RUNTIME VIEW ================"
            uv run python -c "import platform, sys, struct, sysconfig; print('platform.machine() =', platform.machine()); print('platform.platform() =', platform.platform()); print('sys.executable =', sys.executable); print('sys.version =', sys.version.replace('\n',' ')); print('pointer_bits =', struct.calcsize('P')*8); print('sysconfig platform =', sysconfig.get_platform()); print('CC =', sysconfig.get_config_var('CC')); print('CFLAGS =', sysconfig.get_config_var('CFLAGS')); print('LDSHARED =', sysconfig.get_config_var('LDSHARED'))"
            
            PYEXE=$(uv run python -c "import sys; print(sys.executable)")

            echo
            echo "================ PYTHON MACH-O INFO ================"
            echo "Executable: $PYEXE"
            file "$PYEXE" || true
            lipo -info "$PYEXE" 2>/dev/null || true
            otool -hv "$PYEXE" 2>/dev/null || true
            echo

            echo "================ SDK SYSROOT CHECK ================"
            clang -E -x c++ - -v < /dev/null 2>&1 || true
            echo

            echo "================ HOMEBREW (if present) ================"
            which brew || true
            brew config 2>/dev/null || true
            echo

            brew install gnu-sed portaudio git-lfs libjpeg-turbo
            export PATH="/opt/homebrew/opt/gnu-sed/libexec/gnubin:$PATH"
            export ARCHFLAGS="arm64"

          else
            sudo apt-get update
            sudo apt-get install -y \
              curl \
              g++ \
              portaudio19-dev \
              git-lfs \
              libturbojpeg \
              python3-dev \
              pre-commit
          fi

      - name: Install and run tests
        run: |
          bin/ci-fast

