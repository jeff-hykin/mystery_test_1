name: pre_merge

on:
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest_fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            g++ \
            portaudio19-dev \
            git-lfs \
            libturbojpeg \
            python3-dev \
            pre-commit

      - name: Install and run tests
        run: |
          bin/ci-fast